<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoLive TV - Modern Streaming</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for a sleek look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="shrink-0 z-50 glass-panel border-b border-slate-800 px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white shadow-lg shadow-blue-500/20 flex items-center justify-center">
                <i data-lucide="tv" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight hidden sm:block">IndoLive<span class="text-blue-500">TV</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search channels..." 
                    class="bg-slate-900 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-slate-400 w-48 sm:w-64 transition-all">
            </div>
            <button onclick="fetchChannels()" class="p-2 text-blue-400 hover:text-blue-300 rounded-full hover:bg-slate-800 transition-colors bg-slate-800/50" title="Sync Channels from GitHub">
                <i data-lucide="refresh-cw" id="refreshListIcon" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row w-full overflow-hidden">
        
        <!-- Left Column: Video Player & Info -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto bg-slate-950 p-4 sm:p-6 custom-scrollbar">
            
            <div class="max-w-5xl w-full mx-auto flex flex-col gap-6">
                <!-- Video Container -->
                <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-video relative group">
                    <!-- Loading State -->
                    <div id="playerLoading" class="absolute inset-0 flex items-center justify-center bg-slate-900 z-0">
                        <div class="flex flex-col items-center gap-3">
                            <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin"></i>
                            <span class="text-sm text-slate-400 font-medium">Loading stream...</span>
                        </div>
                    </div>
                    
                    <!-- The Iframe -->
                    <iframe 
                        id="tvPlayer" 
                        class="w-full h-full relative z-10 bg-black" 
                        src="" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- Current Channel Info -->
                <div class="glass-panel rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div id="currentChannelLogoWrapper" class="w-16 h-16 shrink-0 bg-white rounded-xl flex items-center justify-center p-2 shadow-inner border border-slate-200/10">
                            <img id="currentChannelLogo" src="" alt="" class="w-full h-full object-contain filter drop-shadow-sm hidden">
                            <span id="currentFallbackTxt" class="text-slate-800 font-black text-xl">TV</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="flex h-2 w-2 relative">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                                </span>
                                <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">Live Now</span>
                            </div>
                            <h2 id="currentChannelName" class="text-2xl font-bold text-white">Select a Channel</h2>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="reloadPlayer()" class="px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700 flex items-center gap-2 font-medium text-sm">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reload
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Channel Sidebar -->
        <div class="w-full lg:w-[380px] shrink-0 border-t lg:border-t-0 lg:border-l border-slate-800 bg-slate-900/50 flex flex-col h-[40vh] lg:h-full z-10">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 backdrop-blur-md">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i data-lucide="list-video" class="w-5 h-5 text-blue-500"></i>
                    Channel List
                </h3>
                <span class="text-xs font-medium bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/20" id="channelCount">0 Channels</span>
            </div>
            
            <!-- Scrollable List -->
            <div id="channelList" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                <!-- Channel cards injected here -->
            </div>
        </div>

    </main>

    <script>
        let channels = [];
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/yogibagus/Daftar-Embed-LIVE-STREAM-Channel-TV-Indonesia/main/README.md';

        // Known TV Channel Logos Map (Wikimedia Commons)
        const channelLogos = {
            'rcti': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/RCTI_2022.svg/512px-RCTI_2022.svg.png',
            'sctv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/SCTV_Logo_2005.svg/512px-SCTV_Logo_2005.svg.png',
            'transtv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Trans_TV_logo_2013.svg/512px-Trans_TV_logo_2013.svg.png',
            'trans7': 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/TRANS7_logo_2013.svg/512px-TRANS7_logo_2013.svg.png',
            'indosiar': 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Indosiar_2014.svg/512px-Indosiar_2014.svg.png',
            'antv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/ANTV_2009.svg/512px-ANTV_2009.svg.png',
            'gtv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/GTV_2017.svg/512px-GTV_2017.svg.png',
            'mnctv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/MNCTV_2010.svg/512px-MNCTV_2010.svg.png',
            'tvone': 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/TvOne_logo.svg/512px-TvOne_logo.svg.png',
            'metrotv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Metro_TV_2010.svg/512px-Metro_TV_2010.svg.png',
            'kompastv': 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Kompas_TV_2016.svg/512px-Kompas_TV_2016.svg.png',
            'net': 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/NET._Logo.svg/512px-NET._Logo.svg.png'
        };

        let activeChannelId = null;
        let isFetching = false;

        const channelListContainer = document.getElementById('channelList');
        const tvPlayer = document.getElementById('tvPlayer');
        const currentChannelName = document.getElementById('currentChannelName');
        const currentChannelLogo = document.getElementById('currentChannelLogo');
        const currentFallbackTxt = document.getElementById('currentFallbackTxt');
        const channelCount = document.getElementById('channelCount');
        const searchInput = document.getElementById('searchInput');
        const playerLoading = document.getElementById('playerLoading');

        // Function 5: Map logo from name
        function getLogoUrl(channelName) {
            const normalized = channelName.toLowerCase().replace(/[^a-z0-9]/g, '');
            for (const [key, logo] of Object.entries(channelLogos)) {
                if (normalized.includes(key)) return logo;
            }
            // Fallback UI Avatar
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName)}&background=1e293b&color=3b82f6&bold=true`;
        }

        // Function 3: Table Parsing Logic
        function parseMarkdownTableToChannels(markdownText) {
            const lines = markdownText.split('\n');
            const extractedChannels = [];
            const processedUrls = new Set();
            let idCounter = 1;

            for (const line of lines) {
                // Only process markdown table rows
                if (!line.includes('|')) continue;
                
                const columns = line.split('|').map(col => col.trim());
                let linkIndex = -1;
                
                // Find the column containing the URL
                for (let i = 0; i < columns.length; i++) {
                    if (columns[i].includes('http')) {
                        linkIndex = i;
                        break;
                    }
                }

                // If a link column is found and it is not the very first column
                if (linkIndex > 0) {
                    let rawName = columns[linkIndex - 1];
                    let rawLink = columns[linkIndex];
                    
                    // Extract URL (from Markdown [text](url) or HTML <a href="url"> or raw text)
                    let urlMatch = rawLink.match(/(https?:\/\/[^\s"'<)]+)/);
                    if (!urlMatch) continue;
                    let url = urlMatch[1];

                    // Clean up Channel Name (Strip HTML and numbers)
                    let name = rawName.replace(/<[^>]*>?/gm, ''); // Remove HTML tags
                    name = name.replace(/^[\d.\s]+/, ''); // Remove leading numbers (e.g., "1.", "02 ", "12. ")
                    name = name.trim();

                    if (name && url && !processedUrls.has(url) && !url.includes('github.com')) {
                        processedUrls.add(url);
                        extractedChannels.push({
                            id: 'ch_' + idCounter++,
                            name: name,
                            logo: getLogoUrl(name),
                            embedUrl: url
                        });
                    }
                }
            }
            return extractedChannels;
        }

        // Function 4 & 2: Fetch and Auto-Refresh
        async function fetchChannels() {
            if (isFetching) return;
            isFetching = true;
            
            // Get initial reference
            const initialIcon = document.getElementById('refreshListIcon');
            if(initialIcon) initialIcon.classList.add('animate-spin');

            try {
                let response = await fetch(GITHUB_RAW_URL);
                if (response.ok) {
                    const markdownText = await response.text();
                    const parsedChannels = parseMarkdownTableToChannels(markdownText);
                    
                    if (parsedChannels.length > 0) {
                        channels = parsedChannels;
                        
                        const searchTerm = searchInput ? searchInput.value : '';
                        renderChannels(getFilteredChannels(searchTerm));
                        channelCount.textContent = `${channels.length} Channels`;
                        
                        // Auto-play first channel if none playing
                        if (!activeChannelId && channels.length > 0) {
                            playChannel(channels[0]);
                        }
                    }
                }
            } catch (error) {
                console.error("Error fetching channels:", error);
            } finally {
                isFetching = false;
                // Re-query the icon because lucide.createIcons() replaces the DOM element during render
                const currentIcon = document.getElementById('refreshListIcon');
                if(currentIcon) currentIcon.classList.remove('animate-spin');
            }
        }

        function init() {
            lucide.createIcons();
            fetchChannels();
            // Auto-refresh every 5 minutes (300,000 ms)
            setInterval(fetchChannels, 300000);

            tvPlayer.addEventListener('load', () => {
                playerLoading.style.display = 'none';
            });
        }

        function renderChannels(channelsToRender) {
            channelListContainer.innerHTML = '';
            
            if (channelsToRender.length === 0) {
                channelListContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-500">
                        <i data-lucide="tv-off" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p>No channels found.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            channelsToRender.forEach(channel => {
                const isActive = channel.id === activeChannelId;
                
                const card = document.createElement('div');
                card.className = `
                    group cursor-pointer rounded-xl p-3 flex items-center gap-4 transition-all duration-200 border
                    ${isActive 
                        ? 'bg-blue-600/10 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.1)]' 
                        : 'bg-slate-800/40 border-transparent hover:bg-slate-800 hover:border-slate-700'}
                `;
                card.onclick = () => playChannel(channel);

                card.innerHTML = `
                    <div class="w-14 h-10 shrink-0 bg-white rounded-lg p-1 flex items-center justify-center relative overflow-hidden shadow-sm">
                        <img src="${channel.logo}" alt="${channel.name}" class="w-full h-full object-contain z-10"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="hidden text-slate-800 font-bold text-[10px] uppercase text-center leading-none">${channel.name.substring(0,4)}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold truncate ${isActive ? 'text-blue-400' : 'text-slate-200 group-hover:text-white'}">
                            ${channel.name}
                        </h4>
                        <div class="flex items-center gap-1.5 mt-0.5 opacity-70">
                            <i data-lucide="radio" class="w-3 h-3 ${isActive ? 'text-red-400' : 'text-slate-400'}"></i>
                            <span class="text-[11px] text-slate-400">Live</span>
                        </div>
                    </div>
                    ${isActive ? `
                        <div class="flex h-3 items-center justify-center gap-0.5 pr-1">
                            <div class="w-1 h-1.5 bg-blue-500 rounded-full animate-[bounce_1s_infinite_0ms]"></div>
                            <div class="w-1 h-2.5 bg-blue-500 rounded-full animate-[bounce_1s_infinite_200ms]"></div>
                            <div class="w-1 h-3 bg-blue-500 rounded-full animate-[bounce_1s_infinite_400ms]"></div>
                        </div>
                    ` : ''}
                `;
                
                channelListContainer.appendChild(card);
            });
            
            lucide.createIcons();
        }

        function playChannel(channel) {
            activeChannelId = channel.id;
            playerLoading.style.display = 'flex';
            tvPlayer.src = channel.embedUrl;
            
            currentChannelName.textContent = channel.name;
            
            // Handle logo updating safely
            currentChannelLogo.src = channel.logo;
            currentChannelLogo.style.display = 'block';
            currentFallbackTxt.style.display = 'none';
            
            currentChannelLogo.onerror = function() {
                this.style.display = 'none';
                currentFallbackTxt.style.display = 'block';
                currentFallbackTxt.textContent = channel.name.substring(0, 3).toUpperCase();
            };

            renderChannels(getFilteredChannels(searchInput.value));
            
            // Mobile: Scroll to top when selecting a channel
            if (window.innerWidth < 1024) {
                const mainArea = document.querySelector('main > div:first-child');
                if (mainArea) mainArea.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function reloadPlayer() {
            const currentSrc = tvPlayer.src;
            tvPlayer.src = '';
            playerLoading.style.display = 'flex';
            setTimeout(() => { tvPlayer.src = currentSrc; }, 300);
        }

        function getFilteredChannels(query) {
            const term = query.toLowerCase().trim();
            if (!term) return channels;
            return channels.filter(c => c.name.toLowerCase().includes(term));
        }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const filtered = getFilteredChannels(e.target.value);
                renderChannels(filtered);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoLive TV - Modern Streaming</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for sleek look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Image fallback background */
        .logo-bg {
            background-color: #cbd5e1;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white shadow-lg shadow-blue-500/20">
                <i data-lucide="tv" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">IndoLive<span class="text-blue-500">TV</span></h1>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
            <button onclick="fetchChannels()" class="p-2 text-blue-400 hover:text-blue-300 rounded-full hover:bg-slate-800 transition-colors" title="Sync Channels from GitHub">
                <i data-lucide="refresh-cw" id="refreshListIcon" class="w-5 h-5"></i>
            </button>
            <div class="relative hidden sm:block">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search channels..." 
                    class="bg-slate-900 border border-slate-700 text-sm rounded-full pl-9 pr-4 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-white placeholder-slate-400 w-64 transition-all">
            </div>
            <button class="p-2 text-slate-400 hover:text-white sm:hidden rounded-full hover:bg-slate-800 transition-colors">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col lg:flex-row gap-6 lg:gap-8">
        
        <!-- Left Column: Video Player & Info (Takes up more space) -->
        <div class="flex-1 flex flex-col gap-4">
            
            <!-- Video Container -->
            <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 aspect-video relative group">
                <!-- Loading State (shown briefly before iframe loads) -->
                <div id="playerLoading" class="absolute inset-0 flex items-center justify-center bg-slate-900 z-0">
                    <i data-lucide="loader-2" class="w-8 h-8 text-blue-500 animate-spin"></i>
                </div>
                
                <!-- The Iframe -->
                <iframe 
                    id="tvPlayer" 
                    class="w-full h-full relative z-10 bg-black" 
                    src="" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Current Channel Info -->
            <div class="glass-panel rounded-2xl p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div id="currentChannelLogoWrapper" class="w-16 h-16 shrink-0 bg-white rounded-xl flex items-center justify-center p-2 shadow-inner border border-slate-200/10">
                        <img id="currentChannelLogo" src="" alt="Channel Logo" class="w-full h-full object-contain filter drop-shadow-sm">
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="flex h-2 w-2 relative">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                            </span>
                            <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">Live Now</span>
                        </div>
                        <h2 id="currentChannelName" class="text-2xl font-bold text-white">Select a Channel</h2>
                        <p class="text-sm text-slate-400 mt-1">High-Quality Streaming</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="reloadPlayer()" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700" title="Reload Stream">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                    </button>
                    <button class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700" title="Share">
                        <i data-lucide="share-2" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Channel List (Sidebar on desktop, grid/list below on mobile) -->
        <div class="w-full lg:w-80 xl:w-96 flex flex-col h-auto lg:h-[calc(100vh-8rem)]">
            <div class="flex items-center justify-between mb-4 px-1">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                    <i data-lucide="list-video" class="w-5 h-5 text-blue-500"></i>
                    Channel List
                </h3>
                <span class="text-xs font-medium bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700" id="channelCount">0</span>
            </div>
            
            <!-- Scrollable List -->
            <div id="channelList" class="flex-1 overflow-y-auto pr-2 pb-4 space-y-3">
                <!-- Channel cards will be injected here via JavaScript -->
            </div>
        </div>

    </main>

    <script>
        /**
         * DATA STRUCTURE:
         * Channels are dynamically fetched from the GitHub README.
         */
        let channels = [];
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/yogibagus/Daftar-Embed-LIVE-STREAM-Channel-TV-Indonesia/main/README.md';

        // State variables
        let activeChannelId = null;
        let isFetching = false;

        // DOM Elements
        const channelListContainer = document.getElementById('channelList');
        const tvPlayer = document.getElementById('tvPlayer');
        const currentChannelName = document.getElementById('currentChannelName');
        const currentChannelLogo = document.getElementById('currentChannelLogo');
        const channelCount = document.getElementById('channelCount');
        const searchInput = document.getElementById('searchInput');
        const playerLoading = document.getElementById('playerLoading');

        // Parser Function to extract channels from Markdown
        function parseMarkdownToChannels(markdown) {
            const extractedChannels = [];
            // Regex to match Markdown links: [Channel Name](URL)
            const regex = /\[([^\]]+)\]\(([^)]+)\)/g;
            let match;
            let idCounter = 1;

            while ((match = regex.exec(markdown)) !== null) {
                const name = match[1].trim();
                let url = match[2].trim();
                
                // Remove surrounding quotes if accidentally parsed
                url = url.replace(/^['"]|['"]$/g, '');

                // Ensure it looks like a valid embed or stream URL 
                // (filtering out github profile links, anchor links, etc.)
                if (url.startsWith('http') && !url.includes('github.com')) {
                    // Generate a dynamic placeholder logo using UI Avatars
                    const logoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=1e293b&color=3b82f6&bold=true`;
                    
                    extractedChannels.push({
                        id: 'ch_' + idCounter++,
                        name: name,
                        logo: logoUrl,
                        embedUrl: url
                    });
                }
            }
            return extractedChannels;
        }

        // Fetch Logic
        async function fetchChannels() {
            if (isFetching) return;
            isFetching = true;
            
            const refreshBtnIcon = document.getElementById('refreshListIcon');
            if(refreshBtnIcon) refreshBtnIcon.classList.add('animate-spin');

            try {
                let response = await fetch(GITHUB_RAW_URL);
                if (!response.ok) {
                    // Fallback to master branch if main is not found
                    response = await fetch(GITHUB_RAW_URL.replace('/main/', '/master/'));
                }
                
                if (response.ok) {
                    const markdownText = await response.text();
                    const parsedChannels = parseMarkdownToChannels(markdownText);
                    
                    if (parsedChannels.length > 0) {
                        channels = parsedChannels;
                        
                        // Maintain current search filter if active
                        const searchTerm = searchInput ? searchInput.value : '';
                        renderChannels(getFilteredChannels(searchTerm));
                        channelCount.textContent = channels.length;
                        
                        // Auto-play first channel if none is playing
                        if (!activeChannelId && channels.length > 0) {
                            playChannel(channels[0]);
                        }
                    }
                } else {
                    console.error("Failed to fetch channel data.");
                }
            } catch (error) {
                console.error("Error fetching channels:", error);
            } finally {
                isFetching = false;
                if(refreshBtnIcon) refreshBtnIcon.classList.remove('animate-spin');
            }
        }

        // Initialize App
        function init() {
            lucide.createIcons(); // Initialize icons
            
            // Initial fetch
            fetchChannels();

            // Auto-refresh interval (every 5 minutes = 300000 ms)
            setInterval(fetchChannels, 300000);

            // Set up iframe load event to hide loader
            tvPlayer.addEventListener('load', () => {
                playerLoading.style.display = 'none';
            });
        }

        // Render Channel Cards
        function renderChannels(channelsToRender) {
            channelListContainer.innerHTML = '';
            
            if (channelsToRender.length === 0) {
                channelListContainer.innerHTML = `
                    <div class="text-center py-8 text-slate-500">
                        <i data-lucide="tv-off" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        <p>No channels found.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            channelsToRender.forEach(channel => {
                const isActive = channel.id === activeChannelId;
                
                const card = document.createElement('div');
                card.className = `
                    group cursor-pointer rounded-xl p-3 flex items-center gap-4 transition-all duration-200 border
                    ${isActive 
                        ? 'bg-blue-600/10 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.15)]' 
                        : 'bg-slate-800/50 border-slate-700 hover:bg-slate-800 hover:border-slate-600 hover:-translate-y-0.5'}
                `;
                card.onclick = () => playChannel(channel);

                card.innerHTML = `
                    <div class="w-16 h-12 shrink-0 bg-white rounded-lg p-1.5 flex items-center justify-center relative overflow-hidden">
                        <img src="${channel.logo}" alt="${channel.name}" 
                             class="w-full h-full object-contain z-10"
                             onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'text-slate-800 font-bold text-xs\\'>${channel.name.substring(0,3)}</span>'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-semibold truncate ${isActive ? 'text-blue-400' : 'text-slate-200 group-hover:text-white'}">
                            ${channel.name}
                        </h4>
                        <div class="flex items-center gap-1.5 mt-1 opacity-70">
                            <i data-lucide="radio" class="w-3 h-3 ${isActive ? 'text-blue-400' : 'text-slate-400'}"></i>
                            <span class="text-xs text-slate-400">Live Stream</span>
                        </div>
                    </div>
                    ${isActive ? `
                        <div class="flex h-4 items-center justify-center gap-0.5 pr-2">
                            <div class="w-1 h-2 bg-blue-500 rounded-full animate-[bounce_1s_infinite_0ms]"></div>
                            <div class="w-1 h-3 bg-blue-500 rounded-full animate-[bounce_1s_infinite_200ms]"></div>
                            <div class="w-1 h-4 bg-blue-500 rounded-full animate-[bounce_1s_infinite_400ms]"></div>
                        </div>
                    ` : ''}
                `;
                
                channelListContainer.appendChild(card);
            });
            
            // Re-initialize icons for newly added HTML
            lucide.createIcons();
        }

        // Handle Channel Selection
        function playChannel(channel) {
            // Update State
            activeChannelId = channel.id;
            
            // Show loader
            playerLoading.style.display = 'flex';
            
            // Update Iframe Source
            tvPlayer.src = channel.embedUrl;
            
            // Update UI Info
            currentChannelName.textContent = channel.name;
            currentChannelLogo.src = channel.logo;
            
            // Handle logo load error fallback in the main view
            currentChannelLogo.onerror = function() {
                this.style.display = 'none';
                const wrapper = document.getElementById('currentChannelLogoWrapper');
                let fallbackTxt = document.getElementById('fallbackTxt');
                if(!fallbackTxt) {
                    fallbackTxt = document.createElement('span');
                    fallbackTxt.id = 'fallbackTxt';
                    fallbackTxt.className = 'text-slate-800 font-black text-xl';
                    wrapper.appendChild(fallbackTxt);
                }
                fallbackTxt.textContent = channel.name.substring(0, 3).toUpperCase();
            };
            currentChannelLogo.onload = function() {
                this.style.display = 'block';
                const fallbackTxt = document.getElementById('fallbackTxt');
                if(fallbackTxt) fallbackTxt.remove();
            }

            // Re-render list to reflect active state
            renderChannels(getFilteredChannels(searchInput.value));
            
            // On mobile, scroll up to player
            if (window.innerWidth < 1024) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Helper to reload the current stream
        function reloadPlayer() {
            const currentSrc = tvPlayer.src;
            tvPlayer.src = '';
            playerLoading.style.display = 'flex';
            setTimeout(() => {
                tvPlayer.src = currentSrc;
            }, 300);
        }

        // Search Functionality
        function getFilteredChannels(query) {
            const term = query.toLowerCase().trim();
            if (!term) return channels;
            return channels.filter(c => c.name.toLowerCase().includes(term));
        }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const filtered = getFilteredChannels(e.target.value);
                renderChannels(filtered);
            });
        }

        // Run initialization
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

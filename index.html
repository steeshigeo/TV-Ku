<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Ku - Nonton Seru</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern Vibrant Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.5); /* Pink hover */
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        
        /* Glassmorphism Utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 text-white font-sans h-screen flex flex-col overflow-hidden selection:bg-pink-500 selection:text-white">

    <!-- Navbar -->
    <nav class="shrink-0 z-50 glass-panel px-4 sm:px-6 h-20 flex items-center justify-between border-b-0 border-white/10">
        <div class="flex items-center gap-3">
            <!-- Cute Custom SVG Logo -->
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-pink-500 to-orange-400 rounded-2xl blur opacity-40 group-hover:opacity-75 transition duration-500"></div>
                <div class="relative bg-white/10 p-2.5 rounded-2xl flex items-center justify-center border border-white/20">
                    <svg class="w-8 h-8 text-pink-400 drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Antennas -->
                        <path d="M7 3L11 7" />
                        <path d="M17 3L13 7" />
                        <!-- TV Body -->
                        <rect x="2" y="7" width="20" height="14" rx="4" ry="4" fill="currentColor" fill-opacity="0.15" />
                        <!-- Cute Eyes -->
                        <path d="M8 12.5 Q8 13.5 8 14.5" stroke-width="3" stroke-linecap="round" />
                        <path d="M16 12.5 Q16 13.5 16 14.5" stroke-width="3" stroke-linecap="round" />
                        <!-- Happy Mouth -->
                        <path d="M9 17.5 Q12 20 15 17.5" />
                    </svg>
                </div>
            </div>
            
            <h1 class="text-3xl font-extrabold tracking-tight hidden sm:flex items-baseline gap-2">
                <div>TV <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-orange-400">Ku</span></div>
                <span class="text-sm opacity-75 font-medium tracking-normal">by frans</span>
            </h1>
        </div>
        
        <div class="flex items-center gap-3 sm:gap-4">
            <div class="relative group">
                <i data-lucide="search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-white/50 group-focus-within:text-pink-400 transition-colors"></i>
                <input type="text" id="searchInput" placeholder="Cari channel..." 
                    class="bg-black/20 border border-white/10 rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 text-white placeholder-white/40 w-48 sm:w-64 transition-all shadow-inner font-medium text-sm">
            </div>
            <button onclick="fetchChannels()" class="p-3 text-white/70 hover:text-white rounded-full hover:bg-white/10 transition-all active:scale-95 border border-transparent hover:border-white/20" title="Sync Channels">
                <i data-lucide="refresh-cw" id="refreshListIcon" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row w-full overflow-hidden p-2 sm:p-4 gap-4">
        
        <!-- Left Column: Video Player & Info -->
        <div class="flex-1 flex flex-col h-full overflow-y-auto custom-scrollbar rounded-3xl">
            
            <div class="max-w-6xl w-full mx-auto flex flex-col gap-4 pb-10">
                <!-- Video Container (Glass Wrapped) -->
                <div class="glass-panel p-2 sm:p-3 rounded-[2rem] w-full shadow-[0_0_40px_rgba(236,72,153,0.15)] relative">
                    <div id="videoWrapper" class="w-full bg-black rounded-3xl overflow-hidden aspect-video relative shadow-inner border border-white/5">
                        <!-- Loading State -->
                        <div id="playerLoading" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm z-0">
                            <div class="flex flex-col items-center gap-4">
                                <i data-lucide="loader-2" class="w-10 h-10 text-pink-500 animate-spin"></i>
                                <span class="text-sm text-white/70 font-semibold tracking-wide bg-white/10 px-4 py-1.5 rounded-full border border-white/10">Menyiapkan siaran...</span>
                            </div>
                        </div>
                        
                        <!-- The Iframe -->
                        <iframe 
                            id="tvPlayer" 
                            class="w-full h-full relative z-10 bg-black" 
                            src="" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- Current Channel Info -->
                <div class="glass-panel rounded-3xl p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5 relative overflow-hidden">
                    <!-- Decorative glow -->
                    <div class="absolute -right-20 -top-20 w-40 h-40 bg-pink-500/20 blur-3xl rounded-full"></div>
                    
                    <div class="flex items-center gap-5 relative z-10">
                        <div id="currentChannelLogoWrapper" class="w-20 h-20 shrink-0 bg-white rounded-2xl flex items-center justify-center p-2.5 shadow-xl border-4 border-white/20 transform hover:scale-105 transition-transform duration-300">
                            <img id="currentChannelLogo" src="" alt="" class="w-full h-full object-contain filter drop-shadow-sm hidden">
                            <span id="currentFallbackTxt" class="text-slate-800 font-black text-2xl">TV</span>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="flex h-2.5 w-2.5 relative">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-pink-500 shadow-[0_0_10px_rgba(236,72,153,0.8)]"></span>
                                </span>
                                <span class="text-xs font-bold text-pink-400 uppercase tracking-widest">Live Sekarang</span>
                            </div>
                            <h2 id="currentChannelName" class="text-3xl font-extrabold text-white">Pilih Channel</h2>
                        </div>
                    </div>
                    <div class="flex gap-2 relative z-10">
                        <button onclick="reloadPlayer()" class="px-5 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-white transition-all border border-white/20 shadow-lg flex items-center gap-2 font-semibold text-sm backdrop-blur-md active:scale-95">
                            <i data-lucide="rotate-cw" class="w-4 h-4"></i> Muat Ulang
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Channel Sidebar -->
        <div class="w-full lg:w-[400px] shrink-0 glass-panel rounded-3xl flex flex-col h-[45vh] lg:h-full z-10 overflow-hidden shadow-2xl">
            <div class="p-5 border-b border-white/10 flex items-center justify-between bg-white/5 backdrop-blur-md relative">
                <h3 class="text-lg font-bold text-white flex items-center gap-2.5">
                    <div class="p-1.5 bg-gradient-to-br from-pink-500 to-orange-400 rounded-lg shadow-md">
                        <i data-lucide="layout-grid" class="w-4 h-4 text-white"></i>
                    </div>
                    Daftar Channel
                </h3>
                <span class="text-xs font-bold bg-white/10 text-white px-3 py-1.5 rounded-full border border-white/20 shadow-inner" id="channelCount">0</span>
            </div>
            
            <!-- Scrollable List -->
            <div id="channelList" class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                <!-- Channel cards injected here -->
            </div>
        </div>

    </main>

    <script>
        let channels = [];
        const GITHUB_RAW_URL = 'https://raw.githubusercontent.com/yogibagus/Daftar-Embed-LIVE-STREAM-Channel-TV-Indonesia/main/README.md';

        // Known TV Channel Logos Map (Wikimedia Commons)
        const channelLogos = {
            "RCTI": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/RCTI_2015.svg/256px-RCTI_2015.svg.png",
            "SCTV": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/SCTV_2022.svg/256px-SCTV_2022.svg.png",
            "TRANS TV": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Trans_TV_2013.svg/256px-Trans_TV_2013.svg.png",
            "TRANS7": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Trans7_2013.svg/256px-Trans7_2013.svg.png",
            "INDOSIAR": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Indosiar_2014.svg/256px-Indosiar_2014.svg.png",
            "MNCTV": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/68/MNCTV_2010.svg/256px-MNCTV_2010.svg.png",
            "GTV": "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/GTV_2017.svg/256px-GTV_2017.svg.png",
            "ANTV": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/ANTV_2016.svg/256px-ANTV_2016.svg.png",
            "RTV": "https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/RTV_2014.svg/256px-RTV_2014.svg.png",
            "TVONE": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/TvOne_2017.svg/256px-TvOne_2017.svg.png",
            "METRO TV": "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/MetroTV_2010.svg/256px-MetroTV_2010.svg.png",
            "KOMPAS TV": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Kompas_TV_2016.svg/256px-Kompas_TV_2016.svg.png",
            "INEWS": "https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/INews_2017.svg/256px-INews_2017.svg.png",
            "NET": "https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/NET_2014.svg/256px-NET_2014.svg.png",
            "CNN INDONESIA": "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/CNN_Indonesia_2015.svg/256px-CNN_Indonesia_2015.svg.png",
            "CNBC INDONESIA": "https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/CNBC_Indonesia_2018.svg/256px-CNBC_Indonesia_2018.svg.png",
            "TVRI": "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/TVRI_2019.svg/256px-TVRI_2019.svg.png"
        };

        let activeChannelId = null;
        let isFetching = false;

        const channelListContainer = document.getElementById('channelList');
        const tvPlayer = document.getElementById('tvPlayer');
        const currentChannelName = document.getElementById('currentChannelName');
        const currentChannelLogo = document.getElementById('currentChannelLogo');
        const currentFallbackTxt = document.getElementById('currentFallbackTxt');
        const channelCount = document.getElementById('channelCount');
        const searchInput = document.getElementById('searchInput');
        const playerLoading = document.getElementById('playerLoading');

        // Helper to find logo
        function getLogo(channelName) {
            const upperName = channelName.toUpperCase();
            const key = Object.keys(channelLogos).find(k => upperName.includes(k));
            return key ? channelLogos[key] : `https://ui-avatars.com/api/?name=${encodeURIComponent(channelName)}&background=random&color=fff&rounded=true&bold=true`;
        }

        // Function 3: Table Parsing Logic (Unchanged core functionality)
        function parseMarkdownTableToChannels(markdownText) {
            const lines = markdownText.split('\n');
            const extractedChannels = [];
            const processedUrls = new Set();
            let idCounter = 1;

            for (const line of lines) {
                if (!line.includes('|')) continue;
                
                const columns = line.split('|').map(col => col.trim());
                let linkIndex = -1;
                
                for (let i = 0; i < columns.length; i++) {
                    if (columns[i].includes('http')) {
                        linkIndex = i;
                        break;
                    }
                }

                if (linkIndex > 0) {
                    let rawName = columns[linkIndex - 1];
                    let rawLink = columns[linkIndex];
                    
                    let urlMatch = rawLink.match(/(https?:\/\/[^\s"'<)]+)/);
                    if (!urlMatch) continue;
                    let url = urlMatch[1];

                    let name = rawName.replace(/<[^>]*>?/gm, ''); 
                    name = name.replace(/^[\d.\s]+/, ''); 
                    name = name.trim();

                    if (name && url && !processedUrls.has(url) && !url.includes('github.com')) {
                        processedUrls.add(url);
                        extractedChannels.push({
                            id: 'ch_' + idCounter++,
                            name: name,
                            logo: getLogo(name),
                            embedUrl: url
                        });
                    }
                }
            }
            return extractedChannels;
        }

        // Function 4 & 2: Fetch and Auto-Refresh
        async function fetchChannels() {
            if (isFetching) return;
            isFetching = true;
            
            const initialIcon = document.getElementById('refreshListIcon');
            if(initialIcon) initialIcon.classList.add('animate-spin');

            try {
                let response = await fetch(GITHUB_RAW_URL);
                if (response.ok) {
                    const markdownText = await response.text();
                    const parsedChannels = parseMarkdownTableToChannels(markdownText);
                    
                    if (parsedChannels.length > 0) {
                        channels = parsedChannels;
                        
                        const searchTerm = searchInput ? searchInput.value : '';
                        renderChannels(getFilteredChannels(searchTerm));
                        channelCount.textContent = `${channels.length} Saluran`;
                        
                        if (!activeChannelId && channels.length > 0) {
                            playChannel(channels[0]);
                        }
                    }
                }
            } catch (error) {
                console.error("Error fetching channels:", error);
            } finally {
                isFetching = false;
                const currentIcon = document.getElementById('refreshListIcon');
                if(currentIcon) currentIcon.classList.remove('animate-spin');
            }
        }

        function init() {
            lucide.createIcons();
            fetchChannels();
            setInterval(fetchChannels, 300000); // 5 mins

            tvPlayer.addEventListener('load', () => {
                playerLoading.style.display = 'none';
            });
        }

        function renderChannels(channelsToRender) {
            channelListContainer.innerHTML = '';
            
            if (channelsToRender.length === 0) {
                channelListContainer.innerHTML = `
                    <div class="text-center py-10 text-white/50 flex flex-col items-center">
                        <div class="bg-white/5 p-4 rounded-full mb-4">
                            <i data-lucide="tv-off" class="w-10 h-10"></i>
                        </div>
                        <p class="font-medium">Tidak ada channel ditemukan.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            channelsToRender.forEach(channel => {
                const isActive = channel.id === activeChannelId;
                
                // Card UI - Differentiated heavily for active vs inactive
                const cardClasses = isActive 
                    ? 'bg-gradient-to-r from-pink-500 to-orange-400 border-transparent shadow-[0_10px_20px_rgba(236,72,153,0.3)] transform scale-[102%] z-10' 
                    : 'glass-card hover:bg-white/10 hover:scale-[102%] border-white/10 text-white/80 hover:text-white';
                
                const titleClasses = isActive ? 'text-white font-bold' : 'font-semibold';
                const subClasses = isActive ? 'text-white/90' : 'text-white/50';
                
                const card = document.createElement('div');
                card.className = `group cursor-pointer rounded-2xl p-3 flex items-center gap-4 transition-all duration-300 relative border ${cardClasses}`;
                card.onclick = () => playChannel(channel);

                card.innerHTML = `
                    <div class="w-16 h-12 shrink-0 bg-white rounded-xl p-1.5 flex items-center justify-center relative overflow-hidden shadow-md">
                        <img src="${channel.logo}" alt="${channel.name}" class="w-full h-full object-contain z-10"
                             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="hidden text-slate-800 font-bold text-[10px] uppercase text-center leading-none">${channel.name.substring(0,4)}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-base truncate ${titleClasses}">
                            ${channel.name}
                        </h4>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <i data-lucide="radio" class="w-3.5 h-3.5 ${isActive ? 'text-white animate-pulse' : 'text-pink-400'}"></i>
                            <span class="text-[11px] font-medium tracking-wide uppercase ${subClasses}">LIVE</span>
                        </div>
                    </div>
                    ${isActive ? `
                        <div class="flex h-4 items-center justify-center gap-0.5 pr-2">
                            <div class="w-1.5 h-2 bg-white rounded-full animate-[bounce_1s_infinite_0ms]"></div>
                            <div class="w-1.5 h-3 bg-white rounded-full animate-[bounce_1s_infinite_200ms]"></div>
                            <div class="w-1.5 h-4 bg-white rounded-full animate-[bounce_1s_infinite_400ms]"></div>
                        </div>
                    ` : `
                        <div class="pr-2 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-lucide="play-circle" class="w-6 h-6 text-white/50"></i>
                        </div>
                    `}
                `;
                
                channelListContainer.appendChild(card);
            });
            
            lucide.createIcons();
        }

        function playChannel(channel) {
            activeChannelId = channel.id;
            playerLoading.style.display = 'flex';
            tvPlayer.src = channel.embedUrl;
            
            currentChannelName.textContent = channel.name;
            
            // Handle logo updating safely
            currentChannelLogo.src = channel.logo;
            currentChannelLogo.style.display = 'block';
            currentFallbackTxt.style.display = 'none';
            
            currentChannelLogo.onerror = function() {
                this.style.display = 'none';
                currentFallbackTxt.style.display = 'block';
                currentFallbackTxt.textContent = channel.name.substring(0, 3).toUpperCase();
            };

            renderChannels(getFilteredChannels(searchInput.value));
            
            // Mobile: Scroll to top when selecting a channel
            if (window.innerWidth < 1024) {
                const mainArea = document.querySelector('main > div:first-child');
                if (mainArea) mainArea.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function reloadPlayer() {
            const currentSrc = tvPlayer.src;
            tvPlayer.src = '';
            playerLoading.style.display = 'flex';
            setTimeout(() => { tvPlayer.src = currentSrc; }, 300);
        }

        function getFilteredChannels(query) {
            const term = query.toLowerCase().trim();
            if (!term) return channels;
            return channels.filter(c => c.name.toLowerCase().includes(term));
        }

        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const filtered = getFilteredChannels(e.target.value);
                renderChannels(filtered);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
